name: .NET publish release to NuGet
on:
  workflow_call:
    inputs:
      tests_to_run:
        required: false
        type: string
    secrets:
      NUGET_USERNAME:
        required: true

env:
  VERSION: ${{github.event.release.tag_name}}

jobs:
  build-and-test:
    name: Build, test and pack
    runs-on: ubuntu-24.04
    steps:
      - name: Write ASSEMBLY_VERSION environment variable
        run: echo "ASSEMBLY_VERSION=$(echo $VERSION | sed -e 's/-.*//')" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Build release build
        run: dotnet build -c Release /p:Version=${{env.VERSION}} /p:AssemblyVersion=${{env.ASSEMBLY_VERSION}}
      - name: Test release build
        run: dotnet test -c Release ${{inputs.tests_to_run}}
      - name: Pack release build
        run: dotnet pack -c Release -o nugetPackage -p:PackageVersion=${{env.VERSION}}
      - name: Save packed artifact
        uses: actions/upload-artifact@v4
        with:
          name: nugetPackage
          path: nugetPackage

  publish-to-nuget:
    name: Publish to NuGet.org
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Load packed artifact
        uses: actions/download-artifact@v4
        with:
          name: nugetPackage
          path: nugetPackage
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{secrets.NUGET_USERNAME}}
      - name: Publish package to NuGet.org
        run: dotnet nuget push nugetPackage/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
